[project]
name = "probnik"
version = "0.1.0"
description = "Backend сервиса пробных экзаменов"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "requests>=2.32,<3",
    "google-cloud-storage>=2.18,<4",
    "google-auth-oauthlib>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
desktop = ["pyinstaller>=6.12,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
